name: Deploy Taller Innovación

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject credentials into HTML files
        env:
          BIN_ID: ${{ secrets.JSONBIN_BIN_ID }}
          API_KEY: ${{ secrets.JSONBIN_API_KEY }}
          ADMIN_PWD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          sed -i "s|JSONBIN_BIN_ID_PLACEHOLDER|${BIN_ID}|g" participante.html
          sed -i "s|JSONBIN_API_KEY_PLACEHOLDER|${API_KEY}|g" participante.html
          sed -i "s|JSONBIN_BIN_ID_PLACEHOLDER|${BIN_ID}|g" admin.html
          sed -i "s|JSONBIN_API_KEY_PLACEHOLDER|${API_KEY}|g" admin.html
          sed -i "s|ADMIN_PASSWORD_PLACEHOLDER|${ADMIN_PWD}|g" admin.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
