name: Deploy Taller Innovación

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject credentials into HTML files
        env:
          BIN_ID: ${{ secrets.JSONBIN_BIN_ID }}
          API_KEY: ${{ secrets.JSONBIN_API_KEY }}
        run: |
          sed -i "s|binId: ''|binId: '${BIN_ID}'|g" participante.html
          sed -i "s|apiKey: ''|apiKey: '${API_KEY}'|g" participante.html
          sed -i "s|binId:''|binId:'${BIN_ID}'|g" admin.html
          sed -i "s|apiKey:''|apiKey:'${API_KEY}'|g" admin.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
